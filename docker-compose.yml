version: '3.8'

services:
  # Backend Flask Service with Gunicorn
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: docker-assignment-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
      - PYTHONUNBUFFERED=1
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Frontend Nginx Service
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docker-assignment-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

# Define custom network for service communication
networks:
  app-network:
    driver: bridge
    name: docker-assignment-network

# Optional: Add volumes for persistent data (if needed in future)
volumes:
  nginx-logs:
    driver: local